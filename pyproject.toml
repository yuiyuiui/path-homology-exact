[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "path-homology-exact"
version = "0.1.0"
description = "Exact non-regular first path homology with representative cycles and replayable certificates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaiwen Jin", email = "yui.ui.siki@gmail.com"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.3", "ruff>=0.14", "sympy>=1.12"]

[project.urls]
Repository = "https://github.com/yuiyuiui/path-homology-exact"
Documentation = "https://github.com/yuiyuiui/path-homology-exact/tree/main/docs"
Issues = "https://github.com/yuiyuiui/path-homology-exact/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
